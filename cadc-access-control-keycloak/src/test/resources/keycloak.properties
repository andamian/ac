# Sample Keycloak configuration for the OpenCADC UMS deployment.
#
# IMPORTANT:
# 1. Use the full SPI property names below (not "public-base-url" alone).
# 2. Keycloak loads SPI settings from .conf files only. This sample is named
#    keycloak.properties for OpenCADC convention; at runtime mount or copy it
#    as keycloak.conf (see README).
#
# Start with an explicit config file (note --config-file BEFORE start-dev):
#   kc.sh --config-file=/path/to/keycloak.conf start-dev
#
# Docker example:
#   docker run -p 8080:8080 \
#     -v "$PWD/keycloak.conf:/opt/keycloak/conf/keycloak.conf:ro" \
#     -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
#     -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
#     keycloak-opencadc-posix start-dev

# Serve the whole Keycloak application (OIDC, admin console, UMS) under /ums.
http-relative-path=/ums

# Enable plain HTTP for local development.
http-enabled=true

# When TLS terminates in front of Keycloak, trust X-Forwarded-* headers.
proxy-headers=xforwarded

# Relax strict hostname checks for local HTTP development.
hostname-strict=false

# Public base URL advertised in the VOSI capabilities document.
spi-realm-restapi-extension-posix-public-base-url=http://localhost:8080/ums

# Realm used to derive the /uid accessURL when uid-access-url is not set.
spi-realm-restapi-extension-posix-realm=master
