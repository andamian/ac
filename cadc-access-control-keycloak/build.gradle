plugins {
    id 'java-library'
    id 'maven-publish'
    id 'checkstyle'
}

repositories {
    mavenCentral()
    mavenLocal()
}

apply from: '../opencadc.gradle'

sourceCompatibility = 17
targetCompatibility = 17

def jdk17Home = System.getenv('JDK17_HOME') ?: '/usr/local/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home'

tasks.withType(JavaCompile).configureEach {
    options.fork = true
    if (file(jdk17Home).exists()) {
        options.forkOptions.javaHome = file(jdk17Home)
    }
}

tasks.withType(Test).configureEach {
    if (file(jdk17Home).exists()) {
        executable = "${jdk17Home}/bin/java"
    }
}

group = 'org.opencadc'

version = '0.1.0'

description = 'OpenCADC Keycloak POSIX account provisioning extension'
def git_url = 'https://github.com/opencadc/ac'

def keycloakVersion = '26.6.4'

configurations {
    keycloakSpi
    compileOnly.extendsFrom(keycloakSpi)
}

dependencies {
    keycloakSpi("org.keycloak:keycloak-core:${keycloakVersion}") { transitive = false }
    keycloakSpi("org.keycloak:keycloak-common:${keycloakVersion}") { transitive = false }
    keycloakSpi("org.keycloak:keycloak-server-spi:${keycloakVersion}") { transitive = false }
    keycloakSpi("org.keycloak:keycloak-server-spi-private:${keycloakVersion}") { transitive = false }
    keycloakSpi("org.keycloak:keycloak-services:${keycloakVersion}") { transitive = false }
    keycloakSpi("org.keycloak:keycloak-ldap-federation:${keycloakVersion}") { transitive = false }
    keycloakSpi("org.jboss.logging:jboss-logging:3.5.3.Final")

    testImplementation 'junit:junit:[4.13,5.0)'
    testImplementation("org.keycloak:keycloak-server-spi:${keycloakVersion}") { transitive = false }
    testImplementation("org.keycloak:keycloak-server-spi-private:${keycloakVersion}") { transitive = false }
    testImplementation("org.keycloak:keycloak-core:${keycloakVersion}") { transitive = false }
}

jar {
    manifest {
        attributes(
                'Implementation-Title': description,
                'Implementation-Version': version
        )
    }
}
